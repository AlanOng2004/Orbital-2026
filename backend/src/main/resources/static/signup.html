<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NUSMaps - Sign Up</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-fade-in {
      animation: fadeIn 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center px-4 bg-gray-50 text-gray-900">
  <div class="w-full max-w-sm animate-fade-in opacity-0">
    <div class="text-center mb-8">
      <img src="img/NUSmaps.png" alt="NUSMaps" class="h-48 mx-auto mb-5">
      <h1 class="text-2xl font-semibold tracking-tight">Create an account</h1>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6">
      <form id="signupForm" class="space-y-4">
        <p id="errorMessage" class="hidden text-sm text-red-600 bg-red-50 rounded-lg px-3 py-2.5 text-center"></p>

        <div class="space-y-1.5">
          <label class="block text-xs font-medium text-gray-500">Username</label>
          <input id="username" type="text" placeholder="Choose a username"
            class="flex h-11 w-full rounded-lg border border-gray-300 bg-transparent px-3 py-1 text-sm shadow-sm transition-colors placeholder:text-gray-400 focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-gray-900"
            autofocus>
        </div>

        <div class="space-y-1.5">
          <label class="block text-xs font-medium text-gray-500">Gender</label>
          <select id="gender"
            class="flex h-11 w-full rounded-lg border border-gray-300 bg-transparent px-3 py-1 text-sm shadow-sm transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-gray-900">
            <option value="">Select your gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="space-y-1.5">
          <label class="block text-xs font-medium text-gray-500">Password</label>
          <input id="password" type="password" placeholder="Create a password"
            class="flex h-11 w-full rounded-lg border border-gray-300 bg-transparent px-3 py-1 text-sm shadow-sm transition-colors placeholder:text-gray-400 focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-gray-900">
        </div>

        <div class="space-y-1.5">
          <label class="block text-xs font-medium text-gray-500">Confirm password</label>
          <input id="confirmPassword" type="password" placeholder="Repeat your password"
            class="flex h-11 w-full rounded-lg border border-gray-300 bg-transparent px-3 py-1 text-sm shadow-sm transition-colors placeholder:text-gray-400 focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-gray-900">
        </div>

        <button id="submitBtn" type="submit"
          class="inline-flex items-center justify-center whitespace-nowrap rounded-lg text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-gray-900 bg-gray-900 text-white hover:bg-gray-800 h-11 w-full mt-2 disabled:opacity-50">
          Create account
        </button>
      </form>

      <div class="mt-4 text-right text-sm">
        <a href="/login.html" class="font-medium text-gray-500 transition-colors hover:text-gray-900">
          Back to login
        </a>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('signupForm');
    const usernameInput = document.getElementById('username');
    const genderInput = document.getElementById('gender');
    const passwordInput = document.getElementById('password');
    const confirmPasswordInput = document.getElementById('confirmPassword');
    const errorMsg = document.getElementById('errorMessage');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const username = usernameInput.value.trim();
      const gender = genderInput.value;
      const password = passwordInput.value;
      const confirmPassword = confirmPasswordInput.value;

      if (!username || !password || !confirmPassword) {
        errorMsg.textContent = 'Please fill in username, password, and confirm password.';
        errorMsg.classList.remove('hidden');
        return;
      }

      if (password !== confirmPassword) {
        errorMsg.textContent = 'Passwords do not match.';
        errorMsg.classList.remove('hidden');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating account...';
      errorMsg.classList.add('hidden');
      errorMsg.textContent = '';

      try {
        const response = await fetch('/api/auth/signup', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            username,
            password,
            gender: gender || null
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Unable to create account.');
        }

        localStorage.setItem('jwt_token', data.token);
        localStorage.setItem('points_app_session', JSON.stringify({
          ...data.user,
          token: data.token
        }));

        window.location.href = data.user.isAdmin ? '/annotator.html' : '/index.html';
      } catch (err) {
        errorMsg.textContent = err.message || 'Unable to create account.';
        errorMsg.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create account';
      }
    });
  </script>
</body>

</html>
