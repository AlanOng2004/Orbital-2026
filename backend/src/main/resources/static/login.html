<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NUSMaps - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-fade-in {
      animation: fadeIn 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center px-4 bg-gray-50 text-gray-900">
  <div class="w-full max-w-sm animate-fade-in opacity-0">
    <div class="text-center mb-8">
      <img src="img/NUSmaps.png" alt="NUSMaps"
        class="h-48 mx-auto mb-5">
      <h1 class="text-2xl font-semibold tracking-tight">NUSMaps</h1>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6">
      <form id="loginForm" class="space-y-4">
        <p id="errorMessage" class="hidden text-sm text-red-600 bg-red-50 rounded-lg px-3 py-2.5 text-center"></p>

        <div class="space-y-1.5">
          <label class="block text-xs font-medium text-gray-500">Username</label>
          <input id="username" type="text" placeholder="Enter your username"
            class="flex h-11 w-full rounded-lg border border-gray-300 bg-transparent px-3 py-1 text-sm shadow-sm transition-colors placeholder:text-gray-400 focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-gray-900"
            autofocus>
        </div>

        <div class="space-y-1.5">
          <label class="block text-xs font-medium text-gray-500">Password</label>
          <input id="password" type="password" placeholder="Enter your password"
            class="flex h-11 w-full rounded-lg border border-gray-300 bg-transparent px-3 py-1 text-sm shadow-sm transition-colors placeholder:text-gray-400 focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-gray-900">
        </div>

        <button id="submitBtn" type="submit"
          class="inline-flex items-center justify-center whitespace-nowrap rounded-lg text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-gray-900 bg-gray-900 text-white hover:bg-gray-800 h-11 w-full mt-2 disabled:opacity-50">
          Login
        </button>
      </form>

      <div class="mt-4 flex items-center justify-between text-sm">
        <a href="/forgot-password.html" class="font-medium text-gray-500 transition-colors hover:text-gray-900">
          Forgot password?
        </a>
        <a href="/signup.html" class="font-medium text-gray-500 transition-colors hover:text-gray-900">
          Sign up
        </a>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const errorMsg = document.getElementById('errorMessage');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = usernameInput.value;
      const password = passwordInput.value;

      if (!username.trim() || !password.trim()) {
        errorMsg.textContent = 'Please enter your username and password.';
        errorMsg.classList.remove('hidden');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Logging in...';
      errorMsg.classList.add('hidden');
      errorMsg.textContent = '';

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            username: username.trim(),
            password: password
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Invalid username or password.');
        }

        // 1. Save the all-important JWT token!
        localStorage.setItem('jwt_token', data.token);

        // 2. Save the user session and keep the token inside it too for consistency
        localStorage.setItem('points_app_session', JSON.stringify({
          ...data.user,
          token: data.token
        }));

        // 3. Return to an allowed requested page, otherwise use the default page for the role.
        setTimeout(() => {
          const requestedRedirect = new URLSearchParams(window.location.search).get('redirect');
          const safeRedirect =
            requestedRedirect &&
            requestedRedirect.startsWith('/') &&
            !requestedRedirect.startsWith('//')
              ? requestedRedirect
              : null;
          const adminOnlyRedirect = safeRedirect === '/suggested-routes.html';
          window.location.href =
            safeRedirect && (!adminOnlyRedirect || data.user.isAdmin)
              ? safeRedirect
              : data.user.isAdmin
                ? '/annotator/index.html'
                : '/index.html';
        }, 0);

      } catch (err) {
        console.error("Actual login error details:", err);

        errorMsg.textContent = 'Invalid username or password.';
        errorMsg.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Login';
      }
    });
  </script>
</body>

</html>
