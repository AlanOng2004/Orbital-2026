spring.application.name=nusmaps-backend
server.port=${PORT:8080}

# Use explicit datasource settings when provided, otherwise fall back to a
# local in-memory database so the app can boot in a fresh checkout.
spring.datasource.url=${SPRING_DATASOURCE_URL:${JDBC_DATABASE_URL:jdbc:postgresql://${PGHOST:postgres.railway.internal}:${PGPORT:5432}/${PGDATABASE:railway}?sslmode=require}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${PGUSER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:}}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}

# Spring Boot automatically maps SPRING_JPA_HIBERNATE_DDL_AUTO to this
# property. Keep only the local default here to avoid a circular placeholder.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}

app.jwt.secret=${APP_JWT_SECRET:HgEKzZWS6hnW7gHnwOhktklJN5gzflvQGmxtTEyhB0r}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
