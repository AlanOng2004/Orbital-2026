spring.application.name=nusmaps-backend

# Use explicit datasource settings when provided, otherwise fall back to a
# local in-memory database so the app can boot in a fresh checkout.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:nusmaps;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}

app.jwt.secret=${APP_JWT_SECRET:change-this-dev-secret-change-this-dev-secret}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}
