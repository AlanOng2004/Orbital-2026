name: Feature request
description: Suggest an improvement to NUS Maps
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: checkboxes
    attributes:
      label: Existing requests
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
  - type: textarea
    attributes:
      label: Problem
      description: What user need or limitation would this address?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed solution
      description: Describe the desired behavior. Mockups and examples are welcome.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Alternatives considered
      description: Describe workarounds or other approaches you considered.
  - type: textarea
    attributes:
      label: Additional context
      description: Add links, screenshots, accessibility considerations, or implementation notes.
